<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Método 365 🌱</title>
</head>

<body>

  <h1>Método 365 🌱</h1>
  <h2>Meu Dia</h2>

  <p>Seu espaço para acompanhar, aos poucos, os hábitos que você vem construindo.</p>

  <hr>

  <h3>🥗 Vegetais</h3>
  <p>Hoje teve vegetais na sua alimentação?</p>

  <label>
    <input type="radio" name="vegetais" value="mais-de-uma">
    🟢 Em mais de uma refeição
  </label><br>

  <label>
    <input type="radio" name="vegetais" value="uma">
    🟡 Apenas em uma refeição
  </label><br>

  <label>
    <input type="radio" name="vegetais" value="nao">
    🔴 Não
  </label>

  <hr>

  <h3>🏃 Movimento</h3>
  <p>Como foi seu movimento hoje?</p>

  <label>
    <input type="radio" name="movimento" value="programado">
    Fiz o que estava programado
  </label><br>

  <label>
    <input type="radio" name="movimento" value="programado-mais">
    Fiz o programado + me movimentei além
  </label><br>

  <label>
    <input type="radio" name="movimento" value="sem-treino">
    Me movimentei, mesmo sem treino programado
  </label><br>

  <label>
    <input type="radio" name="movimento" value="nao">
    Hoje não rolou
  </label>

  <hr>

  <h3>🤝 Relações</h3>
  <p>Hoje você conseguiu respeitar suas escolhas nas relações com outras pessoas?</p>

  <label>
    <input type="radio" name="relacoes" value="sim">
    Sim
  </label><br>

  <label>
    <input type="radio" name="relacoes" value="em-parte">
    Em parte
  </label><br>

  <label>
    <input type="radio" name="relacoes" value="nao">
    Não
  </label><br>

  <label>
    <input type="radio" name="relacoes" value="nao-apareceu">
    Hoje isso não apareceu
  </label>

  <hr>

  <button>Salvar meu dia</button>

</body>
</html>
